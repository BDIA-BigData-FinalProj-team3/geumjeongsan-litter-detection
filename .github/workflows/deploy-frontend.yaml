name: Deploy Frontend to S3

on:
  push:
    branches: [ test ]  # main 브랜치에 push할 때 자동 배포
    paths:
      - 'frontend/**'
      
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 레포 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node 세팅
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 의존성 설치
      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      # 4. Vite 빌드
      - name: Build project
        run: |
          cd frontend
          npm run build
        env:
          # VITE_BACKEND_URL을 비워서 same-origin API 호출 (CORS 회피)
          VITE_BACKEND_URL: ""
          VITE_INGEST_HLS_URL: ${{ secrets.INGEST_HLS_URL }}

      # 5. AWS 인증 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 6. S3 Sync (빌드 산출물 업로드)
      - name: Upload to S3
        run: |
          aws s3 sync frontend/build s3://${{ secrets.S3_BUCKET }} --delete

      # 7. CloudFront 캐시 무효화
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
