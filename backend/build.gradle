plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // .env 파일 지원
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'
    
    // Spring Security (BCrypt 암호화)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    
    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    
    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'
    
    // Hibernate Spatial (PostGIS)
    implementation 'org.hibernate.orm:hibernate-spatial:6.5.2.Final'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // AWS SDK for S3
    implementation 'software.amazon.awssdk:s3:2.20.0'
    
    // Gemini API 호출을 위한 WebClient (Reactive)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    
    // JavaCV for video frame extraction (Linux x86_64 only for Docker)
    implementation 'org.bytedeco:javacv:1.5.9'
    implementation 'org.bytedeco:ffmpeg:5.1.2-1.5.9:linux-x86_64'
    implementation 'org.bytedeco:opencv:4.6.0-1.5.9:linux-x86_64'
    
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

