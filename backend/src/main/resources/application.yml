# Qwen API 설정
qwen:
  api:
    url: ${QWEN_API_URL:http://localhost:8001/predict}

gemini:
  api:
    key: ${GEMINI_API_KEY:} # EC2의 .env나 실행 인자에서 주입받음
    url: https://generativelanguage.googleapis.com
    model: ${GEMINI_MODEL:gemini-2.5-flash}
  prompt:
    trash-analysis: |
      역할: 너는 CCTV 프레임에서 불법 쓰레기 투기(TRASH)를 판별하는 AI다.
      
      [중요 판정 원칙]
      - 실제로 쓰레기가 보이지 않으면 incident_type을 "NONE"으로 설정해야 한다.
      - 쓰레기가 명확히 보일 때만 incident_type을 "TRASH"로 설정한다.
      - 애매하면 incident_type을 "UNCERTAIN"으로 설정하고 detection_confidence를 낮게 준다.
      
      [출력 형식 JSON]
      {
        "incident": {
          "incident_type": "TRASH", // TRASH (쓰레기 있음), NONE (쓰레기 없음), UNCERTAIN (불확실) 중 택 1
          "severity_level": "MEDIUM" // VERY_HIGH, HIGH, MEDIUM, LOW, VERY_LOW 중 택 1 (NONE일 때는 VERY_LOW)
        },
        "trash_detail": {
          "main_category": "PLASTIC", // 쓰레기가 없으면 "NONE_DETECTED"
          "object_amount": "쓰레기 양 설명..." // 쓰레기가 없으면 "없음"
        },
        "incident_auto": {
          "detection_confidence": 0.85,
          "confidence_reason": "판단 근거...",
          "severity_level_reason": "심각도 근거...",
          "detected_features": "흰색 봉투, 갈색 박스, 길가 방치" // 배열 아님. 쉼표로 구분된 하나의 문자열. 쓰레기가 없으면 "관찰된 쓰레기 없음"
        }
      }
    trash-bbox-analysis: |
      역할: 너는 CCTV 프레임에서 쓰레기(불법 투기)를 찾고 정확한 위치를 표시하는 AI다.
      
      [출력 규칙 - 매우 중요!]
      - 반드시 JSON만 출력. (설명/마크다운/코드블록 금지)
      - 좌표는 **반드시 0~1 사이의 정규화된 값** (절대 픽셀 값 사용 금지!)
      - bbox 형식: {"x": 0~1, "y": 0~1, "w": 0~1, "h": 0~1}
        * x: 박스 왼쪽 상단 X 좌표 (0.0=이미지 왼쪽 끝, 0.5=중앙, 1.0=오른쪽 끝)
        * y: 박스 왼쪽 상단 Y 좌표 (0.0=이미지 위쪽 끝, 0.5=중앙, 1.0=아래쪽 끝)
        * w: 박스 너비 비율 (객체의 실제 너비 비율, 정확하게!)
        * h: 박스 높이 비율 (객체의 실제 높이 비율, 정확하게!)
      - bbox는 객체를 정확히 감싸야 함 (너무 크거나 작지 않게)
      - 예시: 이미지 중앙(50%, 50%)에 작은 쓰레기 → {"x": 0.45, "y": 0.48, "w": 0.10, "h": 0.08}
      - 예시: 왼쪽 상단(20%, 15%)에 큰 쓰레기 더미 → {"x": 0.15, "y": 0.10, "w": 0.20, "h": 0.25}
      - 쓰레기가 없으면 detections는 [] 로 출력
      - detection_confidence와 score는 0~1 (예: 0.95)
      
      {
        "incident": { "incident_type": "TRASH|NONE|UNCERTAIN", "severity_level": "VERY_HIGH|HIGH|MEDIUM|LOW|VERY_LOW" },
        "incident_auto": { "detection_confidence": 0.0, "confidence_reason": "", "severity_level_reason": "", "detected_features": "" },
        "trash_detail": { "main_category": "PLASTIC|PAPER|METAL|GLASS|WOOD|FABRIC|ORGANIC|MIXED|NONE_DETECTED", "object_amount": "" },
        "detections": [
          { "label": "trash", "score": 0.95, "bbox": { "x": 0.45, "y": 0.52, "w": 0.08, "h": 0.12 } }
        ]
      }
    fire-bbox-analysis: |
      역할: 너는 CCTV 프레임에서 화재(불꽃)/연기 영역을 찾고 정확한 위치를 표시하는 AI다.
      
      [출력 규칙 - 매우 중요!]
      - 반드시 JSON만 출력. (설명/마크다운/코드블록 금지)
      - 좌표는 **반드시 0~1 사이의 정규화된 값** (절대 픽셀 값 사용 금지!)
      - bbox 형식: {"x": 0~1, "y": 0~1, "w": 0~1, "h": 0~1}
        * x: 박스 왼쪽 상단 X 좌표 (0.0=이미지 왼쪽 끝, 0.5=중앙, 1.0=오른쪽 끝)
        * y: 박스 왼쪽 상단 Y 좌표 (0.0=이미지 위쪽 끝, 0.5=중앙, 1.0=아래쪽 끝)
        * w: 박스 너비 비율 (화염/연기 영역의 실제 너비 비율)
        * h: 박스 높이 비율 (화염/연기 영역의 실제 높이 비율)
      - bbox는 화염/연기 영역을 정확히 감싸야 함
      - label은 "fire" (불꽃) 또는 "smoke" (연기)
      - 화재/연기가 없으면 detections는 [] 로 출력
      - score는 0~1 (신뢰도, 예: 0.92)
      
      예시:
      - 이미지 오른쪽 상단(70%, 20%)에 불꽃 → {"label": "fire", "score": 0.95, "bbox": {"x": 0.65, "y": 0.15, "w": 0.15, "h": 0.20}}
      - 이미지 중앙에 큰 연기 → {"label": "smoke", "score": 0.88, "bbox": {"x": 0.30, "y": 0.25, "w": 0.40, "h": 0.50}}
      
      {
        "detections": [
          { "label": "fire", "score": 0.95, "bbox": { "x": 0.45, "y": 0.30, "w": 0.12, "h": 0.18 } }
        ]
      }
    emergency-analysis: |
      당신은 CCTV 영상(프레임 이미지들)에서 응급상황(부상/쓰러짐/위험)을 평가하는 관제 AI입니다.

      [중요]
      - 반드시 JSON만 출력하세요. (설명/마크다운/코드블록 금지)
      - 한국어로 작성하세요.
      - 프레임에서 확실히 보이는 근거만 사용하고, 보이지 않으면 "판단 불가"로 명시하세요.

      [입력으로 제공되는 추가 정보]
      - YOLO(모델서버) 요약 결과가 텍스트로 함께 주어질 수 있습니다. 이 결과를 참고하되, 프레임과 상충하면 프레임을 우선하세요.

      [Step 1: 상황 분석 항목]
      1) 부상자 수: 정수
      2) 부상 정도: "정상" | "경미" | "중간" | "심각"
      3) 출혈 여부: "없음" | "경미" | "심각" | "판단 불가"
      4) 주변 인원: "혼자" | "1-2명" | "3명 이상" | "판단 불가"
      5) 부상자 행동: "일어서려 함" | "누워 있음" | "도움 요청 제스처" | "판단 불가"

      [Step 2: 신고 가능성 점수 규칙]
      기본점수 12점에서 시작해 아래를 반영해 계산하세요. 점수 범위는 0~17입니다.

      - 부상 정도: 정상(+0), 경미(-2), 중간(-6), 심각(-10)
      - 출혈 여부: 없음(+0), 경미(-2), 심각(-4), 판단 불가(0)
      - 주변 인원: 혼자(-3), 1-2명(+0), 3명 이상(+2), 판단 불가(0)
      - 부상자 행동: 일어서려 함(+2), 누워 있음(+0), 도움 요청 제스처(+1), 판단 불가(0)

      [Step 2-2: 점수 해석(17점 기준)]
      - 12~17: "신고 발생 가능성 매우 높음 / 위험 상황 아님"
      - 9~11: "신고 발생 가능성 보통 / 잠재적 위험, 모니터링 필요"
      - 6~8: "신고 발생 가능성 낮음 / 추가 확인 필요"
      - 3~5: "신고 발생 가능성 매우 낮음 / 관제 개입 필요 가능성 높음"
      - 0~2: "신고 발생 가능성 극히 낮음 / 즉시 관제 개입 필요"

      [emergency_level 규칙]
      - "긴급": 점수 0~5 또는 부상 정도가 "심각"
      - "주의": 점수 6~11
      - "정상": 점수 12~17

      [출력 JSON 형식(단일 JSON)]
      {
        "emergency_level": "긴급|주의|정상",
        "report_possibility_score": "총 17점 중 Y점 (해석문구)",
        "description": "상황 요약(1~2문장)",
        "confidence": 0.0,
        "incident": {
          "incident_type": "EMERGENCY",
          "severity_level": "HIGH|MEDIUM|LOW"
        },
        "emergency_detail": {
          "injured_count": 0
        },
        "incident_auto": {
          "detection_confidence": 0.0,
          "detection_confidence_reason": "",
          "detected_features": [],
          "severity_level_reason": ""
        }
      }