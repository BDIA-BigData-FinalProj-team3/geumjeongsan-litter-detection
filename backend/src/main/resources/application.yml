spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false

server: 
  port: 8080

app:
  deployment:
    time: ${DEPLOYMENT_TIME:}
  build:
    number: ${BUILD_NUMBER:unknown}
  commit:
    sha: ${COMMIT_SHA:unknown}
  environment: ${ENVIRONMENT:test}

# Actuator 설정 (Spring Boot 기본 헬스체크도 사용 가능)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

