spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false

server: 
  port: 8080

app:
  deployment:
    time: ${DEPLOYMENT_TIME:}
  build:
    number: ${BUILD_NUMBER:unknown}
  commit:
    sha: ${COMMIT_SHA:unknown}
  environment: ${ENVIRONMENT:test}

# Actuator 설정 (Spring Boot 기본 헬스체크도 사용 가능)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Trigger deployment - fix JSON parameter issue

# 기상청 API 설정
weather:
  api:
    key: ${WEATHER_API_KEY:YOUR_API_KEY_HERE}  # 공공데이터포털에서 발급받은 Decoding 키
    url: http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtNcst
  location:
    code: GEUMJEONG_SAN
    nx: 98  # 금정산 격자 X 좌표
    ny: 76  # 금정산 격자 Y 좌표