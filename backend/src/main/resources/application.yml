spring:
  jackson:
    # API 응답에서 OffsetDateTime 등이 직렬화될 때의 기본 시간대(표시는 항상 KST)
    time-zone: Asia/Seoul
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  servlet:
    multipart:
      # 로컬 영상 업로드(테스트용)에서 413(Request Entity Too Large) 방지
      max-file-size: 500MB
      max-request-size: 500MB
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          # DB 컬럼이 timestamp(without time zone)인 경우에도 "UTC instant"로 해석/저장하도록 고정
          # (현상: 화면 시간이 -9시간으로 보이는 문제는 대부분 여기서 발생)
          time_zone: UTC
          lob:
            non_contextual_creation: true
    open-in-view: false

server: 
  port: 8080
  tomcat:
    # 일부 환경에서 multipart 요청이 413으로 막히는 경우를 대비
    max-http-form-post-size: 20MB
    max-swallow-size: 20MB

app:
  # FFmpeg 실행 커맨드/경로 (기본: PATH의 ffmpeg)
  # Windows 로컬에서 PATH 문제가 있으면 app.ffmpeg.command를 절대경로로 설정 가능
  # 예) app:
  #       ffmpeg:
  #         command: C:/bin/ffmpeg.exe
  ffmpeg:
    command: ${FFMPEG_COMMAND:ffmpeg}
  python:
    command: C:/Users/kmk/venvs/fire-ai/Scripts/python.exe
  model-server:
    # YOLO/낙상 등 비디오 분석 모델 서버 (기본값은 기존 하드코딩 값을 유지)
    url: ${MODEL_SERVER_URL:http://54.116.3.241:8000/api/v1/video/analyze}
  http:
    # RestTemplate (모델서버 호출/프레임 다운로드 등) 타임아웃
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:600000}
  deployment:
    time: ${DEPLOYMENT_TIME:}
  build:
    number: ${BUILD_NUMBER:unknown}
  commit:
    sha: ${COMMIT_SHA:unknown}
  environment: ${ENVIRONMENT:test}

# Actuator 설정 (Spring Boot 기본 헬스체크도 사용 가능)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Trigger deployment - fix JSON parameter issue

